plugins {
    // Load-bearing, unlike in the consumer repos that run Gradle on their toolchain JDK already:
    // :plugins compiles against JDK 21 (see plugins/build.gradle) while CI and local dev run
    // Gradle on JDK 25, so the toolchain has to be provisioned. Without this, a clean checkout
    // fails with "Cannot find a Java installation ... languageVersion=21".
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'build-conventions'

// :plugins publishes the convention plugins, :catalog the shared version catalog. JitPack
// serves multi-module builds under the dotted group, so consumers reference
// com.github.damianhoward.build-conventions:plugins and :catalog.
include ':plugins', ':catalog'
