name: Release

on:
  push:
    tags:
      # This repository's tags carry no leading `v` — 0.4.12, not v0.4.12.
      - "[0-9]*.[0-9]*.[0-9]*"

# Creating the release and uploading its assets writes to the repository. The default token
# grant is read-only, and a reusable workflow cannot request more than its caller was given.
permissions:
  contents: write

jobs:
  release:
    uses: damianhoward/.github/.github/workflows/release.yml@main
    with:
      # The tag is verified, then published to Maven Central, which consumers resolve from. The
      # GitHub release stays notes-only: a second copy of the artifacts attached there would be two
      # things that could disagree.
      build-command: clean build publishAndReleaseToMavenCentral
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
