// The shared version catalog: versions two or more repos genuinely share, from the TOML at
// gradle/libs.versions.toml. Application-specific dependencies stay in each repo's build file.
plugins {
    id 'version-catalog'
    id 'com.vanniktech.maven.publish'
}

group = 'com.damianhoward'
version = rootProject.version

catalog {
    versionCatalog {
        from(files('../gradle/libs.versions.toml'))
    }
}

mavenPublishing {
    configure(new com.vanniktech.maven.publish.VersionCatalog())
    coordinates('com.damianhoward', 'build-conventions-catalog', version.toString())
    pom {
        name = 'damianhoward build-conventions catalog'
        description = 'The version catalog shared across the damianhoward repositories.'
    }
}
