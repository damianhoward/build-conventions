// The root holds only the repo-wide version and formatting; :plugins publishes the convention
// plugins and :catalog the shared version catalog. JitPack serves them as
// com.github.damianhoward.build-conventions:plugins and :catalog.
plugins {
    id 'com.diffplug.spotless' version '8.10.2'
    // The platform scans its own dependencies too: the Kotlin, Spotless and dependency-check
    // plugins it puts on every consumer's buildscript classpath are exactly the ones a consumer
    // scan never sees. `dependencyCheckAggregate` covers :plugins and :catalog.
    id 'org.owasp.dependencycheck' version '13.0.0'
}

version = '0.5.4'

repositories {
    mavenCentral()
}

def nvdApiKey = providers.environmentVariable('NVD_API_KEY').orNull

// CVE-2026-53914 is unsafe deserialization of Kotlin build-cache metadata, fixed in 2.4.20, and
// every Kotlin artifact carries cpe:/a:jetbrains:kotlin at its own version. The toolchain here is
// 2.4.20 throughout except kotlin-stdlib: kotlin-gradle-plugin pulls kotlinx-coroutines 1.8.0,
// which brings stdlib 1.9.10, because the plugin expects Gradle to supply the stdlib it runs on.
// The standard library holds none of the build-cache metadata path, and on a consumer's
// buildscript classpath Gradle's own copy replaces it. Forcing it higher would make this scan
// report a classpath nothing loads, so the match is suppressed by name instead, and only for the
// stdlib family: a toolchain artifact below 2.4.20 still fails the scan.
def suppressions = layout.buildDirectory.file('dependency-check/kotlin-cpe-suppressions.xml')
def writeSuppressions = tasks.register('writeDependencyCheckSuppressions') {
    description = 'Writes this repository\'s dependency-check suppression file.'
    outputs.file(suppressions)
    def target = suppressions
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = '''<?xml version="1.0" encoding="UTF-8"?>
<suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
    <suppress>
        <notes>CVE-2026-53914 is unsafe deserialization of Kotlin build-cache metadata, in the
        compiler and Gradle tooling. kotlin-stdlib 1.9.10 arrives on this module's classpath
        through kotlinx-coroutines under kotlin-gradle-plugin 2.4.20 and matches only by the
        shared jetbrains:kotlin CPE; it carries none of the affected code, and Gradle supplies
        its own stdlib to a consumer's buildscript.</notes>
        <packageUrl regex="true">^pkg:maven/org\\.jetbrains\\.kotlin/kotlin-stdlib.*$</packageUrl>
        <cve>CVE-2026-53914</cve>
    </suppress>
</suppressions>
'''
    }
}

tasks.named('dependencyCheckAggregate') {
    dependsOn writeSuppressions
}

dependencyCheck {
    suppressionFile = suppressions.get().asFile.absolutePath
    failBuildOnCVSS = 7.0f
    formats = ['HTML', 'JSON']
    if (nvdApiKey) {
        nvd {
            apiKey = nvdApiKey
        }
    }
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nodeAuditEnabled = false
        nuspecEnabled = false
        // kotlin-gradle-plugin is a direct dependency here, and it embeds yarn.lock and
        // pnpm-lock.yaml resources for its Kotlin/JS targets. The analyzer extracts them, calls
        // the NPM Audit API, cannot read a result, and reports `Analysis failed` — a lock file
        // belonging to the Kotlin plugin's own test fixtures fails this repository's scan. Set
        // here rather than in the convention plugins: their consumers scan runtimeClasspath, so
        // no plugin jar reaches them and none has ever hit this. nodeAuditEnabled above does not
        // cover these — Yarn and pnpm are separate analyzers behind their own nested flags.
        nodeAudit {
            yarnEnabled = false
            pnpmEnabled = false
        }
    }
}

// This repository is held to the same formatting bar it imposes on its consumers.
spotless {
    groovyGradle {
        target '*.gradle', 'plugins/*.gradle', 'plugins/src/main/groovy/*.gradle', 'catalog/*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'config', {
        target '.github/**/*.yml', '.github/**/*.yaml', '*.md'
        prettier('3.4.2')
        trimTrailingWhitespace()
        endWithNewline()
    }
    // Prettier ships no TOML parser; hygiene rules only.
    format 'catalog', {
        target 'gradle/*.toml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
