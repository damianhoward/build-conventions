# Two kinds of entry, both here so Dependabot can see them.
#
# Versions genuinely shared across the damianhoward repositories. Application-specific
# dependencies stay in each repo's build file; a version belongs here only when two or
# more repos declare it.
#
# Versions the convention plugins apply themselves. Dependabot cannot read the precompiled
# plugin scripts, so a version written there never moves on its own; :plugins copies these into
# the plugin jar instead (see plugins/build.gradle).

[versions]
commons-lang = "3.21.0"
flyway = "13.9.0"
gson = "2.14.0"
h2 = "2.5.252"
hamcrest = "3.0"
junit = "6.1.3"
kafka = "4.3.1"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
logback = "1.6.5"
lz4 = "1.12.0"
oracle = "23.26.3.0.0"
playwright = "1.63.0"
slf4j = "2.0.20"
testcontainers = "1.21.4"

[libraries]
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-oracle = { module = "org.flywaydb:flyway-database-oracle", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc17", version.ref = "oracle" }
oracle-pki = { module = "com.oracle.database.security:oraclepki", version.ref = "oracle" }
# Every repository with a UI carries a Playwright browser test in its JUnit suite.
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:kafka", version.ref = "testcontainers" }
testcontainers-oracle-free = { module = "org.testcontainers:oracle-free", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }

# Applied by the convention plugins, never declared by a consumer.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4" }
# The :plugins build classpath. One Kotlin version drives both, because the serialization
# compiler plugin must match the compiler exactly.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
