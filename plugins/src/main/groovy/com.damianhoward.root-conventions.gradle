// Shared conventions for a multi-module repository's root project. Modules apply
// kotlin-conventions; the root holds only what spans the whole repository — formatting for
// the Gradle scripts, CI config, and docs, plus the OWASP aggregate scan.
plugins {
    id 'com.diffplug.spotless'
    id 'org.owasp.dependencycheck'
}

// Spotless provisions its formatters through the root project.
repositories {
    mavenCentral()
}

spotless {
    kotlinGradle {
        target '*.gradle.kts'
        ktlint('1.5.0')
    }
    // Config/docs (YAML workflows, Markdown) held to the same bar. Needs Node on PATH for Prettier.
    format 'config', {
        target '.github/**/*.yml', '.github/**/*.yaml', '*.md'
        prettier('3.4.2')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// OWASP dependency vulnerability scanner across all modules: ./gradlew dependencyCheckAggregate
// Fails the build on any dependency with CVSS >= 7.0.
//
// The key matters more here than anywhere else. NVD throttles an unauthenticated caller to 5
// requests per 30 seconds against 50 with a key, and this plugin was the one of the three that
// never read it: the two repositories that scan through it had never once completed a scan. Both
// ran to exactly the six-hour job ceiling on 2026-07-27 — reported as a cancelled run, which
// notifies nobody — and both then failed on HTTP 429. The shared workflow already refuses to run
// without the key; this is the half of that contract that was missing.
def nvdApiKey = providers.environmentVariable('NVD_API_KEY').orNull

dependencyCheck {
    failBuildOnCVSS = 7.0f
    formats = ['HTML', 'JSON']
    // Scan what the modules ship, as java-conventions and kotlin-conventions already do. Without
    // this the aggregate walks every configuration, including the buildscript classpath that the
    // convention plugin itself puts kotlin-gradle-plugin on — orderbook's first completed scan
    // reported 20 findings, every one of them CVE-2026-53914 against a build-time toolchain jar:
    // abi-tools, kotlin-compiler-embeddable, kotlin-build-tools-*, kotlin-daemon-*. None of those
    // is deployed.
    scanConfigurations = ['runtimeClasspath']
    if (nvdApiKey) {
        nvd {
            apiKey = nvdApiKey
            maxRetryCount = 30
        }
    }
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nodeAuditEnabled = false
        nuspecEnabled = false
    }
}
