// A service's release carries its own Java runtime: a jlink image linked from the JDK toolchain its
// tests run on. A release and its rollback each bring the runtime they were built with, a box's JDK
// no longer decides what the service runs on, and production carries no compiler. Apply it beside
// `application`; a service declares its smoke paths, and nothing else varies.
//
//   runtimeImage {
//       smokePaths = ['/readyz', '/']
//   }
//
// Every image carries the same modules, named once below. `check` fails if jdeps finds the code
// using a module outside that set, and starts the installed distribution with JAVA_HOME pointing at
// a JDK that does not exist and probes it.

import com.damianhoward.conventions.runtime.DistributionSmokeTest
import com.damianhoward.conventions.runtime.RuntimeImage
import com.damianhoward.conventions.runtime.RuntimeImageExtension
import com.damianhoward.conventions.runtime.RuntimeModulesCheck

def conventionVersions = new Properties()
getClass().getResourceAsStream('/com/damianhoward/conventions/versions.properties').withCloseable {
    conventionVersions.load(it)
}

// One module set for every service rather than a minimal set per service. A minimal set has to be
// right about what each service loads by name -- a JDBC driver, a SASL client, a JNDI provider --
// which jdeps cannot see, and getting it wrong surfaces as a missing class on the first connection
// in production. This set holds every module the five services were seen to load in production
// over a day of real traffic, plus every module jdeps reports for them, for about 30 MB more than
// the smallest image would be: 116 MB on disk against 84 MB, and nothing to keep in step per
// service. jdk.jcmd and jdk.jfr are there so a running service can be asked for a heap histogram,
// a thread dump or a flight recording; the compiler and the development tools are not.
def imageModules = [
    'java.se',
    'jdk.charsets', 'jdk.crypto.cryptoki', 'jdk.httpserver', 'jdk.jcmd', 'jdk.jfr', 'jdk.localedata',
    'jdk.management', 'jdk.naming.dns', 'jdk.net', 'jdk.security.auth', 'jdk.security.jgss',
    'jdk.unsupported', 'jdk.zipfs',
]

def extension = extensions.create('runtimeImage', RuntimeImageExtension)
extension.smokePaths.convention([])
extension.smokeEnvironment.convention([:])
extension.minimumJdk.convention(conventionVersions.runtimeJdkFloor)
extension.startsInCi.convention(true)

pluginManager.withPlugin('application') {
    def toolchainHome = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath }

    def runtimeImage = tasks.register('runtimeImage', RuntimeImage) {
        group = 'distribution'
        description = 'Links the runtime the distribution carries.'
        modules = imageModules
        jdkHome = toolchainHome
        jdkRelease = toolchainHome.map { it.file('release').asFile.text }
        minimumJdk = extension.minimumJdk
        image = layout.buildDirectory.dir('runtime')
    }

    def verifyRuntimeModules = tasks.register('verifyRuntimeModules', RuntimeModulesCheck) {
        group = 'verification'
        description = 'Fails if the code uses a JDK module the runtime image lacks.'
        image = runtimeImage.flatMap { it.image }
        jdkHome = toolchainHome
        jars.from(tasks.named('jar'), configurations.runtimeClasspath)
        report = layout.buildDirectory.file('runtime-modules.txt')
    }

    distributions.main.contents {
        from(runtimeImage) { into 'runtime' }
    }

    // Gradle's launchers obey JAVA_HOME, and the units set it to the box's JDK. Each is told to
    // prefer the release's own runtime, right after it has worked out where the release is, and the
    // build fails if Gradle's template no longer has the line it is anchored on.
    tasks.named('startScripts') {
        doLast {
            def unix = new File(outputDir, applicationName)
            def unixAnchor = 'APP_HOME=$( cd -P "${APP_HOME:-./}.." > /dev/null && printf \'%s\\n\' "$PWD" ) || exit\n'
            if (!unix.text.contains(unixAnchor)) {
                throw new GradleException('the Unix launcher changed shape; re-anchor the runtime line')
            }
            unix.text = unix.text.replace(unixAnchor, unixAnchor + '[ -x "$APP_HOME/runtime/bin/java" ] && JAVA_HOME=$APP_HOME/runtime\n')

            def windows = new File(outputDir, "${applicationName}.bat")
            def windowsAnchor = 'for %%i in ("%APP_HOME%") do set APP_HOME=%%~fi\r\n'
            if (!windows.text.contains(windowsAnchor)) {
                throw new GradleException('the Windows launcher changed shape; re-anchor the runtime line')
            }
            windows.text = windows.text.replace(windowsAnchor, windowsAnchor + 'if exist "%APP_HOME%\\runtime\\bin\\java.exe" set JAVA_HOME=%APP_HOME%\\runtime\r\n')
        }
    }

    def smokeTestDistribution = tasks.register('smokeTestDistribution', DistributionSmokeTest) {
        group = 'verification'
        description = 'Starts the installed distribution on its own runtime and probes it.'
        install = tasks.named('installDist').map { layout.projectDirectory.dir(it.destinationDir.path) }
        launcher = application.applicationName
        paths = extension.smokePaths
        environment = extension.smokeEnvironment
        log = layout.buildDirectory.file('smoke-test/distribution.log')
        def startsInCi = extension.startsInCi
        onlyIf('the service declares it cannot start in CI') { startsInCi.get() }
    }

    tasks.named('check') {
        dependsOn verifyRuntimeModules, smokeTestDistribution
    }
}
