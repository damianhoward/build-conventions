// Shared Kotlin build conventions for the damianhoward repositories: JDK 25 toolchain, the pinned
// Kotlin version, the 90% JaCoCo instruction gate, Spotless (ktlint + Prettier for config/docs),
// OWASP dependency-check, the JUnit 6 test wiring, and — where a project has benchmarks — the
// jmh source set compiling as part of `check`. A consumer applies this plugin and then
// declares only what is specific to it (its dependencies, an application main class). Front-end
// tooling is content-driven: web assets under src/main/resources/web are Prettier-formatted, and
// a package.json wires `npm run lint` (ESLint) into `check`.
plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'jacoco'
    id 'com.diffplug.spotless'
    id 'org.owasp.dependencycheck'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

kotlin {
    jvmToolchain(25)
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25)
    }
}

dependencies {
    // Jackson arrives transitively — kafka-streams 4.3.1 resolves jackson-databind 2.21.2, which
    // CVE-2026-54512 and CVE-2026-54513 (CVSS 8.1) escape BasicPolymorphicTypeValidator on. Both
    // are fixed in 2.21.4. A BOM is a floor rather than a pin: Gradle takes the highest of the
    // competing constraints, so a repository whose own BOM already resolves higher is unaffected,
    // and the modules stay aligned instead of drifting apart across the 2.21 line.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.21.5')

    constraints {
        // kafka-clients 4.3.1 — the current release — pulls lz4-java 1.10.2, where the native
        // XXHash bindings crash the JVM on invalid byte array ranges (CVE-2026-59949, CVSS 6.5),
        // fixed in 1.11.1. A constraint rather than a dependency: it raises the version only in
        // the repositories that already resolve lz4, and adds nothing to the ones that do not.
        implementation 'at.yawk.lz4:lz4-java:1.11.1'
    }

    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Testcontainers suites carry `disabledWithoutDocker`, so a machine with no Docker daemon runs
// `test` to a green result and then fails jacocoTestCoverageVerification on a percentage that
// measured a fraction of the suite. That reads as "the build is broken" to anyone who does not
// already know Docker was the missing piece, so say so before the tests run rather than after.
def dockerCheckEnabled = !providers.gradleProperty('conventions.skipDockerCheck').present

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    outputs.cacheIf { false }
}

// Deferred: the consumer declares its dependencies after this plugin is applied, so whether the
// project uses Testcontainers is not yet knowable here.
afterEvaluate {
    def declaresTestcontainers = ['testImplementation', 'testRuntimeOnly'].any { name ->
        configurations.findByName(name)?.dependencies?.any { it.group == 'org.testcontainers' }
    }
    if (!declaresTestcontainers || !dockerCheckEnabled) {
        return
    }
    tasks.named('test') {
        doFirst {
            def reachable = false
            try {
                // Output goes to the null device rather than a pipe: closing a pipe the daemon is
                // still writing to kills `docker info` with EPIPE and reads as "no Docker".
                def probe = new ProcessBuilder('docker', 'info', '--format', '{{.ServerVersion}}')
                        .redirectErrorStream(true)
                        .redirectOutput(ProcessBuilder.Redirect.DISCARD)
                        .start()
                reachable = probe.waitFor(30, java.util.concurrent.TimeUnit.SECONDS) && probe.exitValue() == 0
                if (probe.alive) {
                    probe.destroyForcibly()
                }
            } catch (IOException ignored) {
                reachable = false // no docker on PATH
            }
            if (!reachable) {
                throw new GradleException(
                        'No reachable Docker daemon. This project has Testcontainers suites, which would be ' +
                        'silently skipped, and the coverage gate would then fail on a percentage that did not ' +
                        'measure them. Start Docker, or pass -Pconventions.skipDockerCheck to run the rest of ' +
                        'the suite knowingly without them.')
            }
        }
    }
}

// A benchmark source set is compiled by nothing unless something asks for it: `build` covers main
// and test, and the jmh plugin's own tasks only run when a benchmark is run. So a benchmark that
// stops compiling stays broken silently, and orderbook's did — for however long it took to notice
// that a class it passed to MarketSession was no longer the listener that interface wanted.
//
// That matters more than an unused source set normally would, because the benchmarks are evidence:
// a README that advertises throughput, latency and allocation numbers is making a claim a reviewer
// can try, and "it does not compile" is the worst answer available. This is the same shape as the
// `clean check` gap in document 16 — a gate that never covered the thing it was trusted for.
//
// Reacted to rather than assumed: only a project that actually applies the jmh plugin gains the
// dependency, so this is a no-op everywhere else.
plugins.withId('me.champeau.jmh') {
    tasks.named('check') {
        dependsOn 'compileJmhKotlin'
    }
}

// Class-file patterns kept out of both the coverage report and the gate, e.g.
// coverageExcludes = ['**/web/WebServerKt.class']. Every consumer needs at least its process entry
// point excluded, and each was carrying the same ~16-line afterEvaluate/fileTree block to do it —
// in two different spellings, which is how a shared rule stops being one. Declared as an extension
// property rather than a plugin extension so a consumer sets it with one line and no import.
ext.coverageExcludes = []

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    outputs.cacheIf { false }
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

// Deferred to the project, not the task: the consumer assigns coverageExcludes after this plugin is
// applied, so the value is not knowable at configuration time. classDirectories is rebuilt rather
// than filtered because JaCoCo resolves it from the compiled output, and an exclude has to be
// applied to that tree.
afterEvaluate {
    def patterns = project.ext.coverageExcludes
    if (patterns) {
        ['jacocoTestReport', 'jacocoTestCoverageVerification'].each { name ->
            tasks.named(name) { task ->
                task.classDirectories.setFrom(files(task.classDirectories.files.collect { fileTree(dir: it, excludes: patterns) }))
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

// A repo with mock-heavy test code can relax the ktlint line length by setting
// conventions.kotlinMaxLineLength (e.g. 160) in its gradle.properties; unset keeps the default.
def kotlinMaxLineLength = providers.gradleProperty('conventions.kotlinMaxLineLength').orNull

spotless {
    kotlin {
        target 'src/**/*.kt'
        def ktlintStep = ktlint('1.5.0')
        if (kotlinMaxLineLength) {
            ktlintStep.editorConfigOverride(['max_line_length': kotlinMaxLineLength])
        }
    }
    kotlinGradle {
        target '*.gradle.kts'
        ktlint('1.5.0')
    }
    // Config/docs (YAML workflows, Markdown) held to the same bar. Needs Node on PATH for Prettier.
    format 'config', {
        target '.github/**/*.yml', '.github/**/*.yaml', '*.md'
        prettier('3.4.2')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// A project that holds front-end assets gets them formatted to the same bar: Prettier under
// the one spotlessCheck the build already gates on. Targets must be plain String literals —
// Spotless treats a GString as a file path, not an Ant-style pattern.
if (project.file('src/main/resources/web').exists()) {
    spotless {
        format 'web', {
            target 'src/main/resources/web/**/*.html', 'src/main/resources/web/**/*.css', 'src/main/resources/web/**/*.js'
            prettier('3.4.2')
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

// A project that carries npm lint tooling (a package.json) has its ESLint run wired into
// `check`, so lint failures fail the build rather than needing a separate CI step.
if (project.file('package.json').exists()) {
    def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm'] : ['npm']
    def npmCi = tasks.register('npmCi', Exec) {
        description = 'Installs the pinned npm toolchain (npm ci).'
        commandLine(npmCommand + ['ci'])
        inputs.files('package.json', 'package-lock.json')
        outputs.dir('node_modules')
    }
    def eslint = tasks.register('eslint', Exec) {
        description = 'Lints the front-end assets (npm run lint).'
        dependsOn npmCi
        commandLine(npmCommand + ['run', 'lint'])
    }
    tasks.named('check') {
        dependsOn eslint
    }
}

// OWASP dependency vulnerability scanner. Fails the build on any dependency with CVSS >= 7.0.
// The NVD API throttles unauthenticated callers to the point where an update run takes tens of
// minutes and starts returning 403s, so CI passes NVD_API_KEY. A local run without one still
// works; it is only slow.
def nvdApiKey = providers.environmentVariable('NVD_API_KEY').orNull

// dependency-check matches a CVE onto every artifact carrying the affected CPE, and every Kotlin
// artifact carries cpe:/a:jetbrains:kotlin at the compiler's version. CVE-2026-53914 is unsafe
// deserialization of build-cache metadata, which lives in the compiler and Gradle tooling — not
// in the runtime libraries a service actually ships. Suppress those by name, and let it expire so
// the finding returns if the pin has not moved by then. The pin, and the reason it has not moved
// (2.4.20 has no GA release), live in build-conventions.
//
// kotlin-reflect joins kotlin-stdlib here because naming stdlib alone was not enough: the first
// scheduled run after the original suppression failed portfolio-manager on kotlin-reflect 2.1.21,
// which Jackson's Kotlin module pulls onto the runtime classpath. It is runtime reflection, with
// no part in the build-cache metadata path the advisory describes.
def suppressions = layout.buildDirectory.file('dependency-check/kotlin-cpe-suppressions.xml')
def writeSuppressions = tasks.register('writeDependencyCheckSuppressions') {
    description = 'Writes the shared dependency-check suppression file.'
    outputs.file(suppressions)
    def target = suppressions
    doLast {
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = '''<?xml version="1.0" encoding="UTF-8"?>
<suppressions xmlns="https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd">
    <suppress until="2026-11-01Z">
        <notes>CVE-2026-53914 is unsafe deserialization of Kotlin build-cache metadata, which is
        compiler and Gradle-tooling code. It is matched against kotlin-stdlib and kotlin-reflect
        only because they carry the same jetbrains:kotlin CPE as the compiler; neither ships any
        part of the build-cache metadata path. The Kotlin pin is tracked in build-conventions,
        which suppresses the same advisory against its own toolchain classpath under this same
        expiry, so no scan reports it until the date passes or the pin moves. This suppression
        expires so the finding returns if the pin has not moved.</notes>
        <packageUrl regex="true">^pkg:maven/org\\.jetbrains\\.kotlin/kotlin-(stdlib|reflect).*$</packageUrl>
        <cve>CVE-2026-53914</cve>
    </suppress>
</suppressions>
'''
    }
}

// Wired with tasks.named rather than tasks.matching{}.configureEach: the latter realises every
// task in the project, which changes when Spotless resolves its ktlint classpath and leaves it
// incomplete — spotlessKotlinCheck then dies with NoClassDefFoundError on EditorConfigDefaults.
tasks.named('dependencyCheckAnalyze') {
    dependsOn writeSuppressions
}

tasks.named('dependencyCheckAggregate') {
    dependsOn writeSuppressions
}

dependencyCheck {
    suppressionFile = suppressions.get().asFile.absolutePath
    failBuildOnCVSS = 7.0f
    formats = ['HTML', 'JSON']
    // Scan what the service ships. The default scans every configuration, which drags in the
    // Kotlin compiler's own artifacts — the first scheduled run failed every Kotlin repository on
    // CVE-2026-53914 in abi-tools, a build-time toolchain jar that no service deploys. That CVE
    // is real and tracked where the decision lives: the Kotlin pin in build-conventions, which
    // suppresses it against its own toolchain classpath under a dated expiry rather than in the
    // scan output, because the pin is blocked on a Kotlin 2.4.20 GA release.
    scanConfigurations = ['runtimeClasspath']
    if (nvdApiKey) {
        nvd {
            apiKey = nvdApiKey
            // NVD answers 429 once a key's budget is spent, and the client's default of 10
            // retries gives up while the throttle is still on — which fails the build on a
            // transient condition and reads as a security finding in the notification. The
            // delay is left at its default so a warm incremental update stays fast; the real
            // protection against exhausting the budget is not downloading the feed from cold.
            maxRetryCount = 30
        }
    }
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nodeAuditEnabled = false
        nuspecEnabled = false
    }
}
