// The convention plugins. Precompiled Groovy script plugins: each src/main/groovy/*.gradle
// becomes a plugin whose id is the file's base name. Consumers resolve the plugin ids to this
// module via a settings resolutionStrategy (see README).
plugins {
    id 'groovy-gradle-plugin'
    id 'maven-publish'
}

group = 'com.github.damianhoward.build-conventions'
version = rootProject.version

java {
    // The plugin JAR targets JDK 21, not 25: a Gradle plugin must load on whatever JVM Gradle
    // itself runs (17+), and JitPack builds consumers on 21 — a 25-bytecode plugin can't be loaded
    // there. This is the plugin module's own bytecode only; the convention scripts still set
    // languageVersion 25 for consumer code.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    gradlePluginPortal()
    mavenCentral()
}

dependencies {
    // The real artifacts behind the plugin ids the convention plugins apply. A precompiled
    // script plugin can only `apply` a third-party plugin that is on this project's classpath.
    implementation 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'
    implementation 'com.diffplug.spotless:spotless-plugin-gradle:8.10.0'
    implementation 'org.owasp:dependency-check-gradle:13.0.0'

    // The same Jackson floor the convention plugins put under every consumer, applied here
    // because this project does not apply them to itself. dependency-check-gradle 12.2.2 — the
    // current release — resolves jackson-databind 2.21.3 through open-vulnerability-clients,
    // which 11 advisories cover, 3 of them high. Spotless is not a source of Jackson at all, so
    // the 8.9.0 upgrade does not address them.
    implementation platform('com.fasterxml.jackson:jackson-bom:2.22.2')
}

// jsoup arrives through dependency-check-gradle at 1.22.2, which CVE-2026-71497 covers: Cleaner
// can be made to emit markup through a custom raw-text element. Fixed in 1.23.1.
//
// httpclient5 arrives the same way, at 5.6.3, with httpclient5-cache still at 5.6.2 beneath it.
// CVE-2026-71290 scores 9.1: HostnameVerificationPolicy#BUILTIN has no effect on the async
// client, so a server can be impersonated with a certificate for another domain. NVD's range is
// >= 5.4, < 5.6.4. This is the scanner's own HTTP client — the thing that fetches the NVD feed —
// so the exposure is a Gradle plugin talking to NIST, not a service talking to a venue. It is
// still the wrong version to ship on twelve consumers' buildscript classpaths, and 5.6.4 is a
// patch release that costs nothing to take.
//
// A resolutionStrategy rather than a dependency constraint, and the difference is load-bearing.
// A constraint is published into this module's POM, so it reaches every consumer's buildscript
// classpath — and doing that broke ktlint in orderbook: 25 files failed spotlessKotlinCheck with
// NoClassDefFoundError on EditorConfigDefaults, the same fragility the ktlint wiring in
// kotlin-conventions already warns about, where a change in how the plugin classpath resolves
// leaves Spotless's ktlint classpath incomplete. Verified by bisect: the four Dependabot bumps in
// the same release were clean, the constraint alone reproduced it.
//
// Forcing is build-local, publishes nothing, and is the right scope anyway. This classpath is a
// Gradle plugin's, so the exposure never reaches a running service; the copy that does is in
// stocks-analysis-us, where Tika pulls the same version onto the runtime classpath and a
// constraint is declared for it there.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jsoup:jsoup:1.23.1'
        force 'org.apache.httpcomponents.client5:httpclient5:5.6.4'
        force 'org.apache.httpcomponents.client5:httpclient5-cache:5.6.4'
    }
}
